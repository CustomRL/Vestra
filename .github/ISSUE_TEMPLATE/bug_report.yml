name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - vestra
        - '@vestra/core'
        - '@vestra/gateway'
        - '@vestra/rest'
        - '@vestra/types'
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Vestra and Node versions
      placeholder: 'vestra 0.1.0, Node 22.15.0'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the full error and stack trace if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest bot that shows the problem. Redact your token.
      render: typescript
